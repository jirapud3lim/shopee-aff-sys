[project]
name = "shopee-aff-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "publish-spike>=0.1.0",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<13",
]

[tool.uv.sources]
publish-spike = { path = "../spikes/phase0_publish", editable = true }

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
