name: affiliate-staging

x-logging: &staging-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: affiliate-staging-backend:local
  build:
    context: .
    dockerfile: ops/staging/backend.Dockerfile
  init: true
  secrets:
    - staging_db_password
  logging: *staging-logs

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD_FILE: /run/secrets/staging_db_password
    secrets:
      - staging_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "studio", "-d", "studio"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: *staging-logs

  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    volumes:
      - render_data:/var/lib/studio/renders
      - backup_data:/var/lib/studio/backups:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/internal/ready', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 200s

  worker:
    <<: *backend
    command: ["python", "-m", "app.campaign_worker"]
    volumes:
      - render_data:/var/lib/studio/renders:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: ops/staging/web.Dockerfile
    init: true
    ports:
      - "127.0.0.1:${STAGING_WEB_PORT:-3110}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    logging: *staging-logs

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/staging/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/staging/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${STAGING_MONITOR_PORT:-19090}:9090"
    restart: unless-stopped
    logging: *staging-logs

  backup:
    image: postgres:17-bookworm
    profiles: [maintenance]
    entrypoint: ["bash", "/ops/archive.sh"]
    secrets:
      - staging_db_password
    volumes:
      - ./ops/staging/archive.sh:/ops/archive.sh:ro
      - render_data:/var/lib/studio/renders:ro
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *staging-logs

secrets:
  staging_db_password:
    file: ${STAGING_DB_SECRET_FILE:-.env.staging-db-password}

volumes:
  postgres_data:
  render_data:
  backup_data:
  prometheus_data:
